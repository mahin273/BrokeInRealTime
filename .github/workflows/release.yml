name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: .tar.gz
          - os: linux
            arch: arm64
            ext: .tar.gz
          - os: darwin
            arch: arm64
            ext: .tar.gz
          - os: darwin
            arch: amd64
            ext: .tar.gz
          - os: windows
            arch: amd64
            ext: .zip
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          BINARY_NAME="broke-daemon"
          if [ "${{ matrix.os }}" = "windows" ]; then
            BINARY_NAME="broke-daemon.exe"
          fi
          go build -ldflags="-s -w" -o "dist/${BINARY_NAME}" ./cmd/broke-daemon

      - name: Package archive
        run: |
          mkdir -p artifacts
          ARCHIVE_NAME="broke-daemon-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
          cd dist
          if [ "${{ matrix.ext }}" = ".zip" ]; then
            zip -9 "../artifacts/${ARCHIVE_NAME}" *
          else
            tar -czvf "../artifacts/${ARCHIVE_NAME}" *
          fi
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/*

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
